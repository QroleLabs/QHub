name: Validate QHub registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out registry
        uses: actions/checkout@v7
      - name: Validate immutable registry
        run: python3 scripts/validate_registry.py
