name: Validate QHub registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out registry
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate immutable registry
        run: python3 scripts/validate_registry.py
      - name: Test manifest policy
        run: python3 -m unittest discover -s tests -v
      - name: Protect published pull-request history
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_registry.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Protect published push history
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/validate_registry.py --base-ref "${{ github.event.before }}"
